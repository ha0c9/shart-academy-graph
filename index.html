<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="美专图谱">
<link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>上海美专名人图谱 · Shanghai Art School Notable Figures Atlas</title>
<meta name="description" content="上海美术专科学校（1912—1952）创办人、教师与校友的地图式名人图谱：按贡献所在地标注，含照片、生平、贡献、纪念场所与参考来源。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2210%22 fill=%22%23a3271f%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23fff%22%3E%E7%BE%8E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="lib/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="lib/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="seal" aria-hidden="true"><i>美</i><i>专</i></span>
    <div>
      <h1>上海美专名人图谱</h1>
      <p class="subtitle">上海美术专科学校（1912—1952）创办人 · 教师 · 校友 —— 按贡献所在地标注</p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="map" role="tab">地图</button>
    <button class="tab" data-view="table" role="tab">名录</button>
    <button class="tab" data-view="history" role="tab">校史</button>
    <button class="tab" data-view="about" role="tab">说明</button>
  </nav>
</header>

<main>
  <!-- 地图视图 -->
  <section id="view-map" class="view active">
    <aside class="sidebar" id="sidebar">
      <div class="search-box">
        <input id="search" type="search" placeholder="搜索姓名、别名、地点、作品…" autocomplete="off" enterkeyhint="search">
        <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">筛选<span id="filter-count"></span></button>
      </div>
      <div class="filters" id="filters">
        <div class="filter-group">
          <div class="filter-title">与美专关系</div>
          <div class="chips" id="filter-role"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">艺术领域</div>
          <div class="chips" id="filter-field"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">地点类型</div>
          <div class="chips" id="filter-place"></div>
        </div>
        <label class="toggle"><input type="checkbox" id="only-primary"> 仅显示每人的主要贡献地</label>
      </div>
      <div class="list-head">
        <span id="result-count"></span>
        <select id="sort">
          <option value="year">按生年排序</option>
          <option value="name">按姓名排序</option>
          <option value="enroll">按入校/任教年份排序</option>
        </select>
      </div>
      <ul class="person-list" id="person-list"></ul>
    </aside>
    <button class="sidebar-toggle" id="sidebar-toggle" title="收起/展开名单">☰</button>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <article class="detail" id="detail" aria-hidden="true">
      <button class="detail-close" id="detail-close" title="关闭">×</button>
      <div id="detail-body"></div>
    </article>
  </section>

  <!-- 名录视图 -->
  <section id="view-table" class="view">
    <div class="table-toolbar">
      <input id="table-search" type="search" placeholder="在名录中筛选…">
      <span id="table-count"></span>
      <button id="export-csv" class="btn">导出 CSV</button>
      <button id="export-json" class="btn ghost">导出 JSON</button>
    </div>
    <div class="table-wrap">
      <table id="people-table">
        <thead>
          <tr>
            <th data-key="name">姓名</th>
            <th data-key="birth">生卒</th>
            <th data-key="role">身份</th>
            <th data-key="relation">与上海美专的关系</th>
            <th data-key="fields">领域</th>
            <th data-key="place">主要贡献地</th>
            <th data-key="status">核实</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 校史视图 -->
  <section id="view-history" class="view">
    <div class="prose" id="history-body"></div>
  </section>

  <!-- 说明视图 -->
  <section id="view-about" class="view">
    <div class="prose" id="about-body"></div>
  </section>
</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" title="关闭">×</button>
  <figure><img alt=""><figcaption></figcaption></figure>
</div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="lib/markercluster/leaflet.markercluster.js"></script>
<script src="data/people.js"></script>
<script src="data/history.js"></script>
<script src="js/coord.js"></script>
<script src="js/app.js"></script>
</body>
</html>
